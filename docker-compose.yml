name: vedaops

services:
  app:
    image: ${APP_IMAGE:-vedaops-app:local}
    build:
      context: ./app
    container_name: ${APP_CONTAINER_NAME:-vedaops-app}
    environment:
      HEALER_URL: http://healer:8000
      DASHBOARD_ACTION_TOKEN: ${DASHBOARD_ACTION_TOKEN:-}
    restart: "no"
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [backplane]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.29.3-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks: [backplane]
    restart: unless-stopped

  healer:
    image: ${HEALER_IMAGE:-vedaops-healer:local}
    build:
      context: ./healer
    container_name: ${HEALER_CONTAINER_NAME:-vedaops-healer}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALLOWED_CONTAINERS: ${HEALER_ALLOWED_CONTAINERS:-vedaops-app}
      HEALER_TARGET_CONTAINER: ${APP_CONTAINER_NAME:-vedaops-app}
      HEALER_MAX_CALLS_PER_MIN: ${HEALER_MAX_CALLS_PER_MIN:-1}
      HEALER_MAX_RESTARTS_PER_HOUR: ${HEALER_MAX_RESTARTS_PER_HOUR:-3}
      HEALER_LOG_LINES: ${HEALER_LOG_LINES:-50}
      VEDAOPS_COMPOSE_PROJECT: vedaops
      DOCKER_HOST: tcp://docker-proxy:2375
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - docker-proxy
    networks: [backplane, docker_api, egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      POST: "1"
      PING: "1"
      VERSION: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_api]
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.60.6
    privileged: true
    command:
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    networks: [backplane]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    networks: [backplane]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_RULES_FILE:-./monitoring/alert.rules.yml}:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [cadvisor, alertmanager]
    networks: [backplane]
    restart: unless-stopped

  prometheus-cloud:
    image: prom/prometheus:v3.15.0
    profiles: [grafana-cloud]
    command:
      - --config.file=/etc/prometheus/prometheus-cloud.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./.runtime/prometheus-cloud.yml:/etc/prometheus/prometheus-cloud.yml:ro
      - prometheus-cloud-data:/prometheus
      - ./.secrets/grafana_cloud_token:/run/secrets/grafana_cloud_token:ro
    depends_on: [app, cadvisor, node-exporter]
    networks: [backplane, egress]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    networks: [backplane]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-deploy}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_PATH:-./monitoring/grafana/dashboards}:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    networks: [backplane]
    restart: unless-stopped

volumes:
  alertmanager-data:
  grafana-data:
  prometheus-data:
  prometheus-cloud-data:

networks:
  backplane:
    internal: true
  docker_api:
    internal: true
  egress:
